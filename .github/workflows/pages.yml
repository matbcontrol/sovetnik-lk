# Публичный стенд на GitHub Pages: папка site/ как есть, без закрытых данных (site/data/private.json в репозиторий
# не попадает — он в .gitignore). Пока репозиторий закрыт, задача пропускается; после открытия и включения Pages
# (Settings → Pages → Source: GitHub Actions) стенд обновляется при каждом изменении site/ и по кнопке Run workflow.
name: Стенд на GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Закрытых данных в стенде нет
        run: test ! -e site/data/private.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub иногда не сразу видит только что загруженный архив стенда («No artifacts named github-pages»),
      # а перезапуск того же прогона находит уже два архива. Поэтому повтор — в этом же прогоне, через полминуты.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Подождать полминуты перед повтором
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
